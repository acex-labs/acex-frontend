name: Build and Push Dev Image

# Development images from the `dev` branch, published to the same GHCR
# repository as ci.yml but under separate tags:
#   ghcr.io/acex-labs/acex-frontend:dev          moving tag, newest successful build
#   ghcr.io/acex-labs/acex-frontend:dev-<sha>    commit-specific, 7-character SHA
# `latest` and the package.json version tag are only published from `main`.

on:
  push:
    branches:
      - dev

# A newer push cancels an older run, so a stale build can never move `dev`
# backwards after a newer one has published.
concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The trigger already limits this workflow to `dev`; the guard makes sure
    # nothing is ever published if the trigger list is widened later.
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/acex-labs/acex-frontend
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
