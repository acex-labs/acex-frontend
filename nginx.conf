server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Generated at container start by entrypoint.sh — must never be cached,
    # otherwise runtime config (API_URL, brand overrides) can go stale.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # index.html references hashed assets; it must be revalidated so new
    # deployments are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
