<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none">
  <!-- Icon: stacked triangles / stylised A -->
  <polygon points="36,4 68,64 4,64" fill="#0a5a9e"/>
  <polygon points="36,15 61,60 11,60" fill="#1472be"/>
  <polygon points="36,28 53,55 19,55" fill="#1e8fd8"/>
  <polygon points="36,40 46,52 26,52" fill="#2eaaee"/>
  <polygon points="36,49 41,56 31,56" fill="#5cc8ff"/>

  <!-- "Ace" -->
  <text x="82" y="52" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.5">Ace</text>
  <!-- "B" -->
  <text x="173" y="52" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.5">B</text>
  <!-- "i" stem (no built-in dot) -->
  <rect x="196" y="28" width="7" height="24" rx="1" fill="#ffffff"/>
  <!-- blue dot above i -->
  <circle cx="199.5" cy="20" r="5" fill="#2eaaee"/>
  <!-- "t" -->
  <text x="208" y="52" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.5">t</text>
</svg>
